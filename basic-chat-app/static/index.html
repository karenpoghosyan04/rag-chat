<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ContextFlow turns your PDFs into answers with page citations." />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="/brand/contextflow-mark.svg" />
    <link rel="stylesheet" href="/styles.css?v=20261024-model-choice" />
    <script>
      window.MathJax = {
        loader: { load: ['ui/safe'] },
        tex: { inlineMath: { '[+]': [['$', '$']] } },
        svg: { fontCache: 'global' },
        startup: {
          ready() {
            MathJax.startup.defaultReady()
            document.dispatchEvent(new Event('mathjax-ready'))
          },
        },
      }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
    <title>ContextFlow</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <img class="brand-mark" src="/brand/contextflow-mark.svg" alt="" width="48" height="48" />
        <div>
          <h1>ContextFlow</h1>
          <p>Answers grounded in your PDFs</p>
        </div>
        <div class="topbar-actions">
          <div class="status" id="status"><span></span><span id="status-text">Checking setup</span></div>
        </div>
        <div class="model-control">
          <label for="embedding-model">Document search</label>
          <select id="embedding-model" aria-describedby="embedding-model-status" disabled>
            <option value="google/embeddinggemma-2">Gemma · default</option>
            <option value="BAAI/bge-small-en-v1.5">BGE · faster indexing</option>
          </select>
          <span id="embedding-model-status" role="status">Changing models rebuilds document search.</span>
        </div>
      </header>

      <section class="chat" id="chat" aria-live="polite" aria-label="Conversation">
        <div class="welcome" id="welcome">
          <img class="welcome-mark" src="/brand/contextflow-mark.svg" alt="" width="96" height="96" />
          <p class="welcome-brand">ContextFlow</p>
          <h2>Your documents. In context.</h2>
          <p>Add a PDF. Ask a question. Follow the sources.</p>
          <div class="suggestions">
            <button type="button" data-prompt="Summarize the main ideas in the uploaded PDF.">Summarize the PDF</button>
            <button type="button" data-prompt="What are the three most important facts in this document?">Find key facts</button>
            <button type="button" data-prompt="What does the document say about its main conclusion?">Explain its conclusion</button>
          </div>
        </div>
      </section>

      <form class="composer" id="composer">
        <div class="document-bar" id="document-bar">
          <input class="sr-only" id="pdf-input" type="file" accept="application/pdf,.pdf" />
          <button class="document-button" type="button" id="upload-pdf">＋ Add PDF</button>
          <span class="document-status" id="document-status">No document loaded</span>
          <button class="remove-document" type="button" id="remove-pdf" hidden aria-label="Remove PDF">Remove</button>
        </div>
        <label class="sr-only" for="message">Message</label>
        <textarea id="message" rows="1" placeholder="Ask ContextFlow about your PDF…" maxlength="6000" required></textarea>
        <button type="submit" id="send" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Zm7 1 3-4" /></svg>
        </button>
        <div class="composer-meta"><span>Enter to send · Shift + Enter for a new line</span><button type="button" id="clear">Clear chat</button></div>
      </form>
    </main>

    <script src="/app.js?v=20261024-model-choice"></script>
  </body>
</html>
